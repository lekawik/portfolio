<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" role="img" aria-label="Block diagram of one node">
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; }
  :root { --ink:#14213d; --muted:#5b6472; --tint:#eef3f5; --rng:#0f7c8a; --rng-soft:#d5edf0; --dat:#d98a1f; --dat-soft:#f8e3c2; --paper:#fff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f2f2f7; --muted:#a1a1aa; --tint:#1c1c1e; --rng:#4fc3d1; --rng-soft:#0f3b42; --dat:#f0b35a; --dat-soft:#4a3410; --paper:#000; } }
  .box { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
  .box-t { fill: var(--tint); stroke: var(--ink); stroke-width: 1.2; }
  .ln { stroke: var(--ink); stroke-width: 1.2; fill: none; }
  .ln-d { stroke: var(--dat); stroke-width: 1.5; fill: none; }
  .ln-m { stroke: var(--muted); stroke-width: 0.8; fill: none; }
  .ln-r { stroke: var(--rng); stroke-width: 1.5; fill: none; }
  .t-b { font-weight: 600; fill: var(--ink); }
  .t-s { font-size: 9.5px; fill: var(--muted); }
  .t-w { fill: #fff; font-weight: 600; }
  .dash { stroke-dasharray: 4 3; }
  .dat { fill: var(--dat); } .dats { fill: var(--dat-soft); stroke: var(--dat); stroke-width: 1; }
  .rng { fill: var(--rng); } .rngs { fill: var(--rng-soft); stroke: var(--rng); stroke-width: 1; }
  text { fill: var(--ink); }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink)"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--rng)"/></marker>
  <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker>
</defs>

    <!-- shield -->
    <rect x="10" y="30" width="170" height="130" class="box-t"/>
    <text x="95" y="50" text-anchor="middle" class="t-b">DWM3000EVB shield</text>
    <rect x="30" y="64" width="130" height="50" class="box"/>
    <text x="95" y="84" text-anchor="middle" class="t-b">DW3110</text>
    <text x="95" y="99" text-anchor="middle" class="t-s">UWB ch 5, 6.8 Mbit/s</text>
    <text x="95" y="134" text-anchor="middle" class="t-s">antenne intégrée · 3,3 V uniquement</text>
    <text x="95" y="148" text-anchor="middle" class="t-s">horodatages à 15,65 ps</text>
    <path d="M95 30 L95 12 M83 4 L95 14 L107 4" class="ln"/>
    <!-- SPI -->
    <line x1="180" y1="78" x2="262" y2="78" class="ln" marker-end="url(#ah)" marker-start="url(#ah)"/>
    <text x="221" y="70" text-anchor="middle" class="t-b">SPI 32 MHz</text>
    <line x1="180" y1="112" x2="262" y2="112" class="ln-m" marker-end="url(#ahm)" marker-start="url(#ahm)"/>
    <text x="221" y="127" text-anchor="middle" class="t-s">IRQ · RSTn</text>
    <!-- pico -->
    <rect x="264" y="20" width="240" height="160" class="box-t"/>
    <text x="384" y="40" text-anchor="middle" class="t-b">Raspberry Pi Pico (RP2040, 2 cœurs)</text>
    <rect x="278" y="52" width="212" height="54" class="rngs"/>
    <text x="384" y="72" text-anchor="middle" class="t-b">cœur 0 — radio et MAC</text>
    <text x="384" y="88" text-anchor="middle" class="t-s">cadencement, TX/RX, horodatages, synchro</text>
    <text x="384" y="100" text-anchor="middle" class="t-s">boucle scrutée, pire passe ≈ 0,6 ms</text>
    <rect x="278" y="116" width="212" height="54" class="dats"/>
    <text x="384" y="136" text-anchor="middle" class="t-b">cœur 1 — côté hôte</text>
    <text x="384" y="152" text-anchor="middle" class="t-s">calcul des distances, réassemblage, rapports,</text>
    <text x="384" y="164" text-anchor="middle" class="t-s">commandes, réglages en flash</text>
    <line x1="384" y1="106" x2="384" y2="116" class="ln-m"/>
    <!-- host -->
    <line x1="504" y1="80" x2="566" y2="80" class="ln" marker-end="url(#ah)" marker-start="url(#ah)"/>
    <text x="535" y="72" text-anchor="middle" class="t-s">série USB</text>
    <rect x="568" y="56" width="102" height="48" class="box"/>
    <text x="619" y="76" text-anchor="middle" class="t-b">Mac + visualiseur</text>
    <text x="619" y="92" text-anchor="middle" class="t-s">aujourd'hui</text>
    <line x1="504" y1="144" x2="566" y2="144" class="ln-m dash" marker-end="url(#ahm)" marker-start="url(#ahm)"/>
    <text x="535" y="136" text-anchor="middle" class="t-s">UART</text>
    <rect x="568" y="120" width="102" height="48" class="box" stroke-dasharray="4 3"/>
    <text x="619" y="140" text-anchor="middle" class="t-b">Contrôleur de vol</text>
    <text x="619" y="156" text-anchor="middle" class="t-s">prévu</text>
    <text x="384" y="200" text-anchor="middle" class="t-s">Des anneaux sans verrou entre les deux cœurs gardent le trafic série et les calculs hors du chemin temporel de la radio.</text>
  </svg>