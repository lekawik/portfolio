<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" role="img" aria-label="Superframe layout for ten nodes">
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; }
  :root { --ink:#14213d; --muted:#5b6472; --tint:#eef3f5; --rng:#0f7c8a; --rng-soft:#d5edf0; --dat:#d98a1f; --dat-soft:#f8e3c2; --paper:#fff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f2f2f7; --muted:#a1a1aa; --tint:#1c1c1e; --rng:#4fc3d1; --rng-soft:#0f3b42; --dat:#f0b35a; --dat-soft:#4a3410; --paper:#000; } }
  .box { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
  .box-t { fill: var(--tint); stroke: var(--ink); stroke-width: 1.2; }
  .ln { stroke: var(--ink); stroke-width: 1.2; fill: none; }
  .ln-d { stroke: var(--dat); stroke-width: 1.5; fill: none; }
  .ln-m { stroke: var(--muted); stroke-width: 0.8; fill: none; }
  .ln-r { stroke: var(--rng); stroke-width: 1.5; fill: none; }
  .t-b { font-weight: 600; fill: var(--ink); }
  .t-s { font-size: 9.5px; fill: var(--muted); }
  .t-w { fill: #fff; font-weight: 600; }
  .dash { stroke-dasharray: 4 3; }
  .dat { fill: var(--dat); } .dats { fill: var(--dat-soft); stroke: var(--dat); stroke-width: 1; }
  .rng { fill: var(--rng); } .rngs { fill: var(--rng-soft); stroke: var(--rng); stroke-width: 1; }
  text { fill: var(--ink); }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink)"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--rng)"/></marker>
  <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker>
</defs>

    <text x="20" y="12" class="t-b">Superframe, N = 10: 23.9 ms</text>
    <!-- ranging slots -->
    <g>
      <rect x="20" y="26" width="162" height="40" class="rngs"/>
      <g class="ln-m" stroke="#0f7c8a">
        <line x1="36.2" y1="26" x2="36.2" y2="66"/><line x1="52.4" y1="26" x2="52.4" y2="66"/><line x1="68.6" y1="26" x2="68.6" y2="66"/><line x1="84.8" y1="26" x2="84.8" y2="66"/><line x1="101" y1="26" x2="101" y2="66"/><line x1="117.2" y1="26" x2="117.2" y2="66"/><line x1="133.4" y1="26" x2="133.4" y2="66"/><line x1="149.6" y1="26" x2="149.6" y2="66"/><line x1="165.8" y1="26" x2="165.8" y2="66"/>
      </g>
      
    </g>
    <!-- data slots -->
    <g>
      <rect x="182" y="26" width="478" height="40" class="dats"/>
      <g stroke="#d98a1f" stroke-width="0.8">
        <line x1="229.8" y1="26" x2="229.8" y2="66"/><line x1="277.6" y1="26" x2="277.6" y2="66"/><line x1="325.4" y1="26" x2="325.4" y2="66"/><line x1="373.2" y1="26" x2="373.2" y2="66"/><line x1="421" y1="26" x2="421" y2="66"/><line x1="468.8" y1="26" x2="468.8" y2="66"/><line x1="516.6" y1="26" x2="516.6" y2="66"/><line x1="564.4" y1="26" x2="564.4" y2="66"/><line x1="612.2" y1="26" x2="612.2" y2="66"/>
      </g>
      <g text-anchor="middle" class="t-b">
        <text x="206" y="50">D0</text><text x="254" y="50">D1</text><text x="301" y="50">D2</text><text x="349" y="50">D3</text><text x="397" y="50">D4</text><text x="445" y="50">D5</text><text x="493" y="50">D6</text><text x="540" y="50">D7</text><text x="588" y="50">D8</text><text x="636" y="50">D9</text>
      </g>
    </g>
    <text x="42" y="82" class="t-s">R0 … R9: ranging section, 10 × 603 µs</text>
    <text x="660" y="82" text-anchor="end" class="t-s">data section, 10 × 1783 µs — slot d owned by node d mod N</text>

    <!-- zoom ranging slot -->
    <path d="M20 90 L20 120 M36.2 66 L36.2 90 L300 120" class="ln-m dash"/>
    <text x="20" y="168" class="t-b">one ranging slot, 603 µs</text>
    <rect x="20" y="122" width="70" height="30" class="box-t"/><text x="55" y="141" text-anchor="middle" class="t-s">150 µs</text>
    <rect x="90" y="122" width="140" height="30" class="rng"/><text x="160" y="141" text-anchor="middle" class="t-w">frame 142 B · 302 µs</text>
    <rect x="230" y="122" width="70" height="30" class="box-t"/><text x="265" y="141" text-anchor="middle" class="t-s">guard</text>
    <text x="20" y="182" class="t-s">150 µs sync margin · guard includes the ~150 µs receiver re-arm</text>
    
    

    <!-- zoom data slot -->
    <path d="M612.2 66 L612.2 90 L340 120 M660 90 L660 120" class="ln-m dash"/>
    <text x="340" y="168" class="t-b">one data slot, 1783 µs</text>
    <rect x="340" y="122" width="27" height="30" class="box-t"/>
    <rect x="367" y="122" width="266" height="30" class="dat"/><text x="500" y="141" text-anchor="middle" class="t-w">frame 1021 B · 1482 µs on air</text>
    <rect x="633" y="122" width="27" height="30" class="box-t"/>
    <text x="340" y="182" class="t-s">header + timestamps ≈ 60–120 B, rest (≈ 900–960 B) is data</text>

    <text x="20" y="216" class="t-s">Duty cycle ≈ 75 %. The remaining quarter is the margins that make the schedule robust: clock error between nodes, the time a receiver</text>
    <text x="20" y="228" class="t-s">is blind while it re-arms, and preamble and header overhead. Drawn to scale horizontally within each row.</text>
  </svg>