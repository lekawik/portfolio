<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-label="Timing ladder for broadcast two-way ranging">
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; }
  :root { --ink:#14213d; --muted:#5b6472; --tint:#eef3f5; --rng:#0f7c8a; --rng-soft:#d5edf0; --dat:#d98a1f; --dat-soft:#f8e3c2; --paper:#fff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f2f2f7; --muted:#a1a1aa; --tint:#1c1c1e; --rng:#4fc3d1; --rng-soft:#0f3b42; --dat:#f0b35a; --dat-soft:#4a3410; --paper:#000; } }
  .box { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
  .box-t { fill: var(--tint); stroke: var(--ink); stroke-width: 1.2; }
  .ln { stroke: var(--ink); stroke-width: 1.2; fill: none; }
  .ln-d { stroke: var(--dat); stroke-width: 1.5; fill: none; }
  .ln-m { stroke: var(--muted); stroke-width: 0.8; fill: none; }
  .ln-r { stroke: var(--rng); stroke-width: 1.5; fill: none; }
  .t-b { font-weight: 600; fill: var(--ink); }
  .t-s { font-size: 9.5px; fill: var(--muted); }
  .t-w { fill: #fff; font-weight: 600; }
  .dash { stroke-dasharray: 4 3; }
  .dat { fill: var(--dat); } .dats { fill: var(--dat-soft); stroke: var(--dat); stroke-width: 1; }
  .rng { fill: var(--rng); } .rngs { fill: var(--rng-soft); stroke: var(--rng); stroke-width: 1; }
  text { fill: var(--ink); }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink)"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--rng)"/></marker>
  <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker>
</defs>

    <!-- lifelines -->
    <text x="130" y="18" text-anchor="middle" class="t-b">node A</text>
    <text x="360" y="18" text-anchor="middle" class="t-b">node B</text>
    <text x="560" y="18" text-anchor="middle" class="t-b">node C (bystander)</text>
    <line x1="130" y1="26" x2="130" y2="310" class="ln"/>
    <line x1="360" y1="26" x2="360" y2="310" class="ln"/>
    <line x1="560" y1="26" x2="560" y2="310" class="ln-m"/>
    <!-- frames -->
    <line x1="130" y1="50" x2="360" y2="68" class="ln-r" marker-end="url(#ahr)"/>
    <line x1="360" y1="68" x2="560" y2="84" class="ln-m dash" marker-end="url(#ahm)"/>
    <text x="245" y="50" text-anchor="middle" class="t-b">frame A₁</text>
    <line x1="360" y1="130" x2="130" y2="148" class="ln-r" marker-end="url(#ahr)"/>
    <line x1="360" y1="130" x2="560" y2="146" class="ln-m dash" marker-end="url(#ahm)"/>
    <text x="245" y="128" text-anchor="middle" class="t-b">frame B₁</text>
    <text x="245" y="160" text-anchor="middle" class="t-s">carries: rx time of A₁</text>
    <line x1="130" y1="210" x2="360" y2="228" class="ln-r" marker-end="url(#ahr)"/>
    <line x1="360" y1="228" x2="560" y2="244" class="ln-m dash" marker-end="url(#ahm)"/>
    <text x="245" y="208" text-anchor="middle" class="t-b">frame A₂</text>
    <text x="245" y="240" text-anchor="middle" class="t-s">carries: rx time of B₁</text>
    <line x1="360" y1="286" x2="130" y2="304" class="ln-r" marker-end="url(#ahr)"/>
    <line x1="360" y1="286" x2="560" y2="302" class="ln-m dash" marker-end="url(#ahm)"/>
    <text x="245" y="284" text-anchor="middle" class="t-b">frame B₂</text>
    <text x="245" y="316" text-anchor="middle" class="t-s">carries: rx time of A₂</text>
    <!-- intervals A side -->
    <line x1="100" y1="50" x2="100" y2="148" class="ln" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <text x="92" y="103" text-anchor="end" class="t-b">Ra</text>
    <line x1="100" y1="152" x2="100" y2="210" class="ln" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <text x="92" y="185" text-anchor="end" class="t-b">Da</text>
    <text x="20" y="70" class="t-s">measured on</text><text x="20" y="81" class="t-s">A's clock</text>
    <!-- intervals B side -->
    <line x1="390" y1="68" x2="390" y2="130" class="ln" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <text x="398" y="103" class="t-b">Db</text>
    <line x1="390" y1="134" x2="390" y2="228" class="ln" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <text x="398" y="185" class="t-b">Rb</text>
    <text x="398" y="158" class="t-s">measured on</text><text x="398" y="169" class="t-s">B's clock</text>
    <!-- bystander note -->
    <text x="572" y="180" class="t-s">hears all four frames,</text>
    <text x="572" y="192" class="t-s">so it holds every</text>
    <text x="572" y="204" class="t-s">timestamp and can</text>
    <text x="572" y="216" class="t-s">compute A–B itself</text>
  </svg>